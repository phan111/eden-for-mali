# SPDX-License-Identifier: GPL-3.0-or-later
name: Build Eden APK (Mali / Galaxy Tab S11)

on:
  workflow_dispatch:
    inputs:
      preset:
        description: "arm64 build preset (YUZU_BUILD_PRESET)"
        type: choice
        default: armv9-x925
        options: [armv9-x925, armv9, optimized, generic, custom]
      build_type:
        description: "Native/Gradle build type"
        type: choice
        default: Release
        options: [Release, RelWithDebInfo]
      flavor:
        description: "Eden product flavor"
        type: choice
        default: standard
        options: [standard, legacy, optimized]
  push:
    branches: [claude/gpu-mali-galaxy-tab-s11-3s6chv]
    # Deliberately excludes the workflow file itself: editing CI should not spend
    # an hour of runner time rebuilding. Use workflow_dispatch for that.
    paths:
      - "patches/**"
      - "eden-source.pin"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      PRESET: ${{ inputs.preset || 'armv9-x925' }}
      BUILD_TYPE: ${{ inputs.build_type || 'Release' }}
      FLAVOR: ${{ inputs.flavor || 'standard' }}
      # Pinned by src/android/app/build.gradle.kts (externalNativeBuild.cmake.version).
      CMAKE_VERSION: 3.31.6
      NDK_VERSION: 28.2.13676358
      CCACHE: "true"
      CCACHE_MAXSIZE: 4G

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Reclaim runner disk space
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/local/lib/android/sdk/ndk \
                      /usr/share/dotnet /usr/local/lib/node_modules \
                      /opt/ghc /usr/local/share/boost /usr/local/graalvm \
                      /usr/local/share/powershell /usr/local/share/chromium \
                      /usr/local/lib/heroku "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}/CodeQL" || true
          sudo apt-get -qq purge -y firefox google-chrome-stable microsoft-edge-stable 2>/dev/null || true
          sudo apt-get -qq autoremove -y || true
          docker image prune -af >/dev/null 2>&1 || true
          echo "after:"; df -h / | tail -1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install build prerequisites
        run: sudo apt-get -qq update && sudo apt-get -qq install -y ccache ninja-build glslang-tools

      # Eden pins an exact CMake version. AGP resolves it from
      # $ANDROID_SDK_ROOT/cmake/<version>/bin, which the SDK repository does not
      # publish, so install the upstream release into that layout.
      - name: Install CMake ${{ env.CMAKE_VERSION }}
        run: |
          set -eux
          url="https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz"
          curl -fsSL --retry 4 --retry-delay 5 -o /tmp/cmake.tar.gz "$url"
          dest="${ANDROID_SDK_ROOT}/cmake/${CMAKE_VERSION}"
          sudo mkdir -p "$dest"
          sudo tar -xzf /tmp/cmake.tar.gz -C "$dest" --strip-components=1
          "$dest/bin/cmake" --version
          echo "$dest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          set -eux
          sdkmanager="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes 2>/dev/null | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      # $HOME cannot be resolved in a job-level env: block, so export CCACHE_DIR
      # from a shell where it can be.
      - name: Configure ccache
        run: |
          echo "CCACHE_DIR=${HOME}/.ccache" >> "$GITHUB_ENV"
          mkdir -p "${HOME}/.ccache"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: eden-mali-ccache-${{ env.PRESET }}-${{ env.BUILD_TYPE }}-${{ hashFiles('eden-source.pin', 'patches/**') }}
          restore-keys: |
            eden-mali-ccache-${{ env.PRESET }}-${{ env.BUILD_TYPE }}-
            eden-mali-ccache-${{ env.PRESET }}-

      - name: Clone Eden and apply the Mali patch series
        run: ./scripts/prepare-source.sh "${GITHUB_WORKSPACE}/eden-src"

      # Make a build say which preset it is, on the device itself. Eden reads
      # GIT-TAG and GIT-RELEASE from the source root
      # (externals/cmake-modules/GetSCMRev.cmake), and GenerateSCMRev.cmake then
      # uses GIT_TAG verbatim as BUILD_VERSION when GIT_RELEASE is defined. The
      # Android overlay displays the segment before the first hyphen as the build
      # id, so the preset lands there and a screen recording of the running game
      # identifies the APK. Hyphens are stripped from the preset for that reason.
      #
      # Both presets otherwise build the same applicationId, install over each
      # other and look identical, which makes an A/B impossible to interpret.
      - name: Stamp the build with its preset
        working-directory: eden-src
        run: |
          set -eux
          preset_tag="${PRESET//-/}"
          stamp="${preset_tag}-r${GITHUB_SHA:0:7}"
          printf '%s' "$stamp" > GIT-TAG
          printf '%s' "${GITHUB_SHA:0:7}" > GIT-RELEASE
          # Also becomes the Android versionName, visible in Settings -> Apps.
          echo "GIT_TAG_NAME=${stamp}" >> "$GITHUB_ENV"
          echo "on-device build id will be: ${preset_tag}  (full: ${stamp})"

      - name: Give Gradle more metaspace
        working-directory: eden-src
        run: |
          {
            echo ""
            echo "# raised by eden-for-mali CI (R8 + a large native build)"
            echo "org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8"
          } >> src/android/gradle.properties

      - name: Build APK
        working-directory: eden-src
        run: |
          set -eux
          ccache -z || true
          chmod +x .ci/android/build.sh src/android/gradlew
          ./.ci/android/build.sh \
            -t "${FLAVOR}" \
            -b "${BUILD_TYPE}" \
            -DYUZU_BUILD_PRESET="${PRESET}"
          ccache -s || true

      - name: Describe artifacts
        if: always()
        working-directory: eden-src
        run: |
          ls -lh artifacts/ 2>/dev/null || echo "no artifacts directory"
          for apk in artifacts/*.apk; do
            [ -e "$apk" ] || continue
            echo "== $apk"
            "${ANDROID_SDK_ROOT}/build-tools/36.0.0/aapt2" dump badging "$apk" 2>/dev/null \
              | grep -E "^package|sdkVersion|targetSdkVersion|native-code" || true
          done

      - name: Upload APK / AAB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eden-mali-${{ env.PRESET }}-${{ env.BUILD_TYPE }}
          path: |
            eden-src/artifacts/*.apk
            eden-src/artifacts/*.aab
          if-no-files-found: warn
          retention-days: 30

      # Keep the APK on the repository itself: workflow artifacts expire and need
      # a signed-in visit to the Actions tab, a release asset is a direct download.
      - name: Publish APK to a GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          eden_commit="$(sed -n 's/^EDEN_COMMIT=//p' eden-source.pin)"
          eden_short="${eden_commit:0:9}"
          tag="apk-${PRESET}-${BUILD_TYPE}"
          title="Eden Mali APK - ${PRESET} (${BUILD_TYPE})"

          # Name the assets after what they actually are, not "app-mainline-release".
          # The name carries this repository's commit as well as Eden's: two builds
          # of the same Eden revision with a different patch series would otherwise
          # land on an identical filename, which is a good way to test the wrong APK.
          repo_short="${GITHUB_SHA:0:7}"
          mkdir -p release
          for f in eden-src/artifacts/*.apk eden-src/artifacts/*.aab; do
            [ -e "$f" ] || continue
            base="$(basename "$f")"
            cp "$f" \
              "release/eden-mali-${PRESET}-${BUILD_TYPE}-eden${eden_short}-r${repo_short}.${base##*.}"
          done
          ls -lh release/

          {
            echo "Eden built for Arm Mali / Immortalis GPUs, targeting the Galaxy Tab S11 / S11 Ultra."
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| build preset | \`${PRESET}\` |"
            echo "| build type | \`${BUILD_TYPE}\` |"
            echo "| flavor | \`${FLAVOR}\` |"
            echo "| Eden commit | \`${eden_commit}\` |"
            echo "| patches applied | $(grep -cvE '^[[:space:]]*(#|$)' patches/series) |"
            echo "| built | $(date -u '+%Y-%m-%d %H:%M') UTC |"
            echo
            echo "Signed with Eden's checked-in debug key, so it installs alongside an"
            echo "official Eden build instead of replacing it."
            echo
            if [ "${PRESET}" = "armv9-x925" ] || [ "${PRESET}" = "armv9" ]; then
              echo "**This build requires Armv9 hardware** (Galaxy Tab S11, Dimensity 9400+ and"
              echo "similar). It will not start on older devices - build the \`optimized\` or"
              echo "\`generic\` preset for those."
              echo
            fi
            echo "See [docs/TAB-S11-TUNING.md](../blob/${GITHUB_REF_NAME}/docs/TAB-S11-TUNING.md)"
            echo "for recommended in-app settings, and [docs/FINDINGS.md](../blob/${GITHUB_REF_NAME}/docs/FINDINGS.md)"
            echo "for what was changed and why."
            echo
            echo "Eden ships no Nintendo code, keys, firmware or games."
          } > release-notes.md

          # The APK is already safely uploaded as a workflow artifact by now, so a
          # release failure must not throw away an hour-long build. The common
          # cause is the repository capping the Actions token at read-only
          # (Settings -> Actions -> General -> Workflow permissions), which no
          # amount of `permissions:` in this file can override - report that
          # clearly and let the job succeed.
          set +e
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            out=$(gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "$title" --notes-file release-notes.md 2>&1)
          else
            out=$(gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "$title" --notes-file release-notes.md \
              --target "$GITHUB_SHA" --prerelease 2>&1)
          fi
          rc=$?
          if [ $rc -eq 0 ]; then
            out=$(gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber release/* 2>&1)
            rc=$?
          fi
          set -e

          if [ $rc -eq 0 ]; then
            # Prune assets from previous builds; the tag is a rolling release and
            # two differently-named APKs sitting on it is worse than none.
            keep=$(cd release && ls | tr '\n' '|' | sed 's/|$//')
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name' | while read -r asset; do
                [ -n "$asset" ] || continue
                if ! printf '%s' "$asset" | grep -qE "^(${keep})$"; then
                  echo "removing stale asset $asset"
                  gh release delete-asset "$tag" "$asset" --repo "$GITHUB_REPOSITORY" --yes || true
                fi
              done
            url=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
            {
              echo "### APK published"
              echo
              echo "Release \`$tag\`: $url"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "$out"
          if printf '%s' "$out" | grep -q "not accessible by integration\|HTTP 403"; then
            echo "::warning title=Release not published::The Actions token is read-only for this repository, so the APK could not be attached to a release. Enable Settings -> Actions -> General -> Workflow permissions -> 'Read and write permissions', then run the publish-release workflow to attach this build without rebuilding it."
            {
              echo "### APK built, but not published to a release"
              echo
              echo "\`gh release\` was denied with HTTP 403, which means this repository"
              echo "caps the Actions token at read-only. The APK is still available as the"
              echo "workflow artifact on this run."
              echo
              echo "To publish it:"
              echo
              echo "1. Settings -> Actions -> General -> Workflow permissions ->"
              echo "   **Read and write permissions** -> Save."
              echo "2. Run the **Publish APK to a Release** workflow with run id \`$GITHUB_RUN_ID\`."
              echo "   That reuses this build - it does not recompile Eden."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::error title=Release publishing failed::gh release exited $rc for an unexpected reason"
          exit $rc

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ env.PRESET }}-${{ env.BUILD_TYPE }}
          path: |
            eden-src/src/android/app/.cxx/**/*.log
            eden-src/src/android/app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
